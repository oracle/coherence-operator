# ---------------------------------------------------------------------------
# Coherence Operator GitHub Actions CI build.
# ---------------------------------------------------------------------------
name: Operator CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
    - gh-pages
    - 1.0.0
    - 2.x
    - 3.x
  pull_request:
    types:
      - opened
      - synchronize
      - committed
    branches-ignore:
    - gh-pages
    - 1.0.0
    - 2.x
    - 3.x

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The final `build` job retains the original check name and gates publication.
jobs:
  prepare:
    name: Prepare Build Artifacts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: ./.github/actions/operator-ci-setup
      with:
        java: 'true'
        docker: 'true'
    - name: Pull Build Base Images
      shell: bash
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker pull gcr.io/distroless/java
        docker pull gcr.io/distroless/java11-debian11
        docker pull gcr.io/distroless/java17-debian11
        docker pull gcr.io/distroless/java17-debian12
        docker pull gcr.io/distroless/java21-debian12
    - name: Build
      env:
        # Bind the setup-docker-action socket into the Spring buildpack container.
        MAVEN_OPTIONS: -Ddocker.bindHostToBuilder=true
        PACK_OPTIONS: --docker-host=inherit
      run: make all
    - name: Package Shared Build
      run: hack/ci/artifacts.sh pack "$RUNNER_TEMP/operator-ci"
    - name: Upload Shared Build
      uses: actions/upload-artifact@v6
      with:
        name: operator-ci-build
        path: ${{ runner.temp }}/operator-ci/build.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Upload Java Build
      uses: actions/upload-artifact@v6
      with:
        name: operator-ci-java
        path: ${{ runner.temp }}/operator-ci/java.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Upload Test Images
      uses: actions/upload-artifact@v6
      with:
        name: operator-ci-images
        path: ${{ runner.temp }}/operator-ci/images.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - uses: actions/upload-artifact@v6
      if: ${{ failure() || cancelled() }}
      with:
        name: test-output-prepare
        path: build/_output/test-logs
        if-no-files-found: ignore

  quality:
    name: Quality and Unit Tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    # Full history is required by the copyright check.
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: ./.github/actions/operator-ci-setup
      with:
        java: 'true'
    - uses: actions/download-artifact@v7
      with:
        name: operator-ci-build
        path: ${{ runner.temp }}/operator-ci
    - uses: actions/download-artifact@v7
      with:
        name: operator-ci-java
        path: ${{ runner.temp }}/operator-ci
    - name: Restore Build
      run: |
        tar -xzf "$RUNNER_TEMP/operator-ci/build.tar.gz"
        tar -xzf "$RUNNER_TEMP/operator-ci/java.tar.gz"
    - name: Code Review
      run: hack/ci/make-prebuilt.sh code-review
    - name: Start KinD Cluster
      run: |
        make kind
        kubectl version
        kubectl get nodes
    - name: Unit Tests
      run: hack/ci/make-prebuilt.sh test-all
    - uses: actions/upload-artifact@v6
      if: ${{ failure() || cancelled() }}
      with:
        name: test-output-quality
        path: build/_output/test-logs
        if-no-files-found: ignore

  integration:
    name: ${{ matrix.name }}
    env:
      KIND_CLUSTER: operator
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: local
          name: E2E Local Tests
        - suite: remote
          name: E2E Remote Tests
        - suite: helm-fips
          name: Helm Chart and FIPS Tests
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/operator-ci-setup
      with:
        docker: 'true'
    # Both E2E suites generate TLS fixtures with keytool after runner cleanup.
    - name: Set up certificate JDK 25
      if: matrix.suite == 'local' || matrix.suite == 'remote'
      uses: oracle-actions/setup-java@v1
      with:
        website: oracle.com
        release: 25
    - uses: actions/download-artifact@v7
      with:
        name: operator-ci-build
        path: ${{ runner.temp }}/operator-ci
    - uses: actions/download-artifact@v7
      with:
        name: operator-ci-images
        path: ${{ runner.temp }}/operator-ci
    - name: Restore Build
      run: tar -xzf "$RUNNER_TEMP/operator-ci/build.tar.gz"
    - name: Start KinD Cluster
      run: |
        make kind
        kubectl version
        kubectl get nodes
    - name: Load Images to KinD
      run: |
        hack/ci/artifacts.sh load-images "$RUNNER_TEMP/operator-ci"
        make kind-load-coherence
        rm "$RUNNER_TEMP/operator-ci/images.tar.gz"
        df -h
    - name: E2E Local Tests
      if: matrix.suite == 'local'
      run: hack/ci/make-prebuilt.sh e2e-local-test
    - name: E2E Remote Tests
      if: matrix.suite == 'remote'
      run: |
        hack/ci/make-prebuilt.sh undeploy
        hack/ci/make-prebuilt.sh uninstall-crds
        hack/ci/make-prebuilt.sh e2e-test
    - name: Helm Chart Tests
      if: matrix.suite == 'helm-fips'
      run: |
        hack/ci/make-prebuilt.sh undeploy
        hack/ci/make-prebuilt.sh uninstall-crds
        hack/ci/make-prebuilt.sh e2e-helm-test
    - name: FIPS Tests
      if: matrix.suite == 'helm-fips'
      run: |
        hack/ci/make-prebuilt.sh undeploy
        hack/ci/make-prebuilt.sh uninstall-crds
        hack/ci/make-prebuilt.sh fips-test
    - uses: actions/upload-artifact@v6
      if: ${{ failure() || cancelled() }}
      with:
        name: test-output-${{ matrix.suite }}
        path: build/_output/test-logs
        if-no-files-found: ignore

  build:
    # Keep `build` as the required aggregate check, even when a dependency skips.
    if: ${{ always() }}
    needs: [prepare, quality, integration]
    runs-on: ubuntu-latest
    steps:
    - name: Check Required Results
      env:
        PREPARE_RESULT: ${{ needs.prepare.result }}
        QUALITY_RESULT: ${{ needs.quality.result }}
        INTEGRATION_RESULT: ${{ needs.integration.result }}
      run: |
        test "$PREPARE_RESULT" = success
        test "$QUALITY_RESULT" = success
        test "$INTEGRATION_RESULT" = success
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v7
      with:
        name: operator-ci-build
        path: ${{ runner.temp }}/operator-ci
    - name: Restore Build
      run: tar -xzf "$RUNNER_TEMP/operator-ci/build.tar.gz"
    - name: Upload Manifests
      uses: actions/upload-artifact@v6
      if: success()
      with:
        name: coherence-operator-manifests.tar.gz
        path: build/_output/coherence-operator-manifests.tar.gz
        if-no-files-found: ignore

    - name: Upload Yaml
      uses: actions/upload-artifact@v6
      if: success()
      with:
        name: coherence-operator.yaml
        path: build/_output/coherence-operator.yaml
        if-no-files-found: ignore

    - name: Upload CRD
      uses: actions/upload-artifact@v6
      if: success()
      with:
        name: coherence.oracle.com_coherence.yaml
        path: build/_output/manifests/crd/coherence.oracle.com_coherence.yaml
        if-no-files-found: ignore

    - uses: actions/download-artifact@v7
      if: ${{ github.ref == 'refs/heads/main' && success() }}
      with:
        name: operator-ci-java
        path: ${{ runner.temp }}/operator-ci
    - name: Restore Java Build
      if: ${{ github.ref == 'refs/heads/main' && success() }}
      run: tar -xzf "$RUNNER_TEMP/operator-ci/java.tar.gz"
    - uses: ./.github/actions/operator-ci-setup
      if: ${{ github.ref == 'refs/heads/main' && success() }}
      with:
        java: 'true'
    - name: Deploy Snapshots & Docs
      if: ${{ github.ref == 'refs/heads/main' && success() }}
      env:
        MAVEN_SONATYPE_USERNAME: ${{ secrets.MAVEN_SONATYPE_USERNAME }}
        MAVEN_SONATYPE_TOKEN: ${{ secrets.MAVEN_SONATYPE_TOKEN }}
      shell: bash
      run: |
        git config --local user.name "Github Action"
        git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
        export NO_DAEMON=false
        make push-snapshot-docs || true
