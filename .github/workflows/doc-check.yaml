# ---------------------------------------------------------------------------
# Coherence Operator GitHub Actions Documentation Link Checker.
# ---------------------------------------------------------------------------
name: Doc Link Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches-ignore:
    - gh-pages
    - 1.0.0
    - 2.x
    - 3.x

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Coherence 21.12.5 requires JDK 17 when Maven runs on Java 24 or later.
    - name: Set up legacy Coherence JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up build JDK 25
      uses: oracle-actions/setup-java@v1
      with:
        website: oracle.com
        release: 25

    - name: Cache Go Modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mods-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mods-

    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-repository-v1-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-repository-v1-

    - name: Edit DNS Resolve
      shell: bash
      run: |
        sudo chown -R runner:runner /run/systemd/resolve/stub-resolv.conf
        sudo echo nameserver 8.8.8.8 > /run/systemd/resolve/stub-resolv.conf

    - name: Start KinD Cluster
      shell: bash
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
        make kind
        kubectl version
        kubectl get nodes

    - name: Documentation Link Check
      shell: bash
      run: |
        make build-operator
        make test-docs
