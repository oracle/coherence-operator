# This is the reported starting state, before managed health security is applied.
apiVersion: coherence.oracle.com/v1
kind: Coherence
metadata:
  name: health-secure
  namespace: ${NAMESPACE}
spec:
  replicas: 2
  image: ${IMAGE_DIGEST}
  healthPort: 8089
  application:
    main: com.oracle.coherence.k8s.testing.RestServer
  coherence:
    cacheConfig: test-cache-config.xml
    persistence:
      mode: active
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  ports:
    - name: test-rest
      port: 8080
