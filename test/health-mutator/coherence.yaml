# Render IMAGE_DIGEST and NAMESPACE using envsubst before applying.
apiVersion: coherence.oracle.com/v1
kind: Coherence
metadata:
  name: health-secure
  namespace: ${NAMESPACE}
spec:
  replicas: 2
  image: ${IMAGE_DIGEST}
  healthPort: 8089
  application:
    main: com.oracle.coherence.k8s.testing.RestServer
  coherence:
    cacheConfig: test-cache-config.xml
    persistence:
      mode: active
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  ports:
    - name: test-rest
      port: 8080
  healthMutatorConnection:
    secure: true
    basicAuth:
      username: {name: health-auth-v1, key: username}
      password: {name: health-auth-v1, key: password}
    tls:
      caSecret: {name: health-ca-v1, key: ca.pem}
      serverName: health.example
    serverTLS:
      enabled: true
      requireClientCert: false
      secrets: health-stores-v1
      keyStore: server.jks
      keyStoreType: JKS
      keyStorePasswordFile: store-password
      keyPasswordFile: store-password
    jaas:
      mode: packaged
